<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>All Users — HelpSphere Admin</title>
  <meta name="description" content="Manage all beneficiaries, NGOs, and donors on the HelpSphere platform." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script>
    (function () {
      var t = localStorage.getItem('hs-theme');
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>

  <div class="liquid-bg" aria-hidden="true">
    <div class="liquid-bg__orb liquid-bg__orb--1"></div>
    <div class="liquid-bg__orb liquid-bg__orb--2"></div>
    <div class="liquid-bg__orb liquid-bg__orb--3"></div>
    <div class="liquid-bg__orb liquid-bg__orb--4"></div>
    <div class="liquid-bg__orb liquid-bg__orb--5"></div>
    <div class="liquid-bg__orb liquid-bg__orb--6"></div>
  </div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar__brand">
      <div class="sidebar__logo">
        <span class="sidebar__logo-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
        </span>
        <div>
          <h1 class="sidebar__title">HelpSphere</h1>
          <span class="sidebar__subtitle">Admin Portal</span>
        </div>
      </div>
    </div>

    <nav class="sidebar__nav">
      <ul class="sidebar__menu">
        <li class="sidebar__menu-label">Main</li>
        <li>
          <a href="index.html" class="sidebar__link" id="nav-dashboard">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
            <span>Dashboard</span>
          </a>
        </li>

        <li class="sidebar__menu-label">Management</li>
        <li>
          <a href="add-ngo.html" class="sidebar__link" id="nav-add-ngo">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
            <span>Add NGO</span>
          </a>
        </li>
        <li>
          <a href="users.html" class="sidebar__link active" id="nav-all-users">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            <span>All Users</span>
          </a>
        </li>
      </ul>
    </nav>

    <div class="sidebar__footer">
      <div class="sidebar__admin">
        <div class="sidebar__avatar">A</div>
        <div>
          <p class="sidebar__admin-name">Admin User</p>
          <p class="sidebar__admin-role">Super Admin</p>
        </div>
      </div>
    </div>
  </aside>

  <div class="overlay" id="overlay"></div>

  <main class="main" id="main">

    <header class="topbar">
      <button class="topbar__hamburger" id="hamburger" aria-label="Toggle sidebar">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="topbar__search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" placeholder="Search anything…" class="topbar__search-input" id="search-input" />
      </div>
      <div class="topbar__actions">
        <button class="topbar__icon-btn theme-toggle" id="theme-toggle" aria-label="Toggle light or dark theme">
          <svg class="theme-toggle__sun" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
          <svg class="theme-toggle__moon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <button class="topbar__icon-btn" aria-label="Notifications" id="btn-notifications">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="topbar__badge">3</span>
        </button>
        <button class="topbar__icon-btn" aria-label="Settings">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </header>

    <section class="page active" id="page-all-users">
      <div class="page__header">
        <div>
          <h2 class="page__title">All Users</h2>
          <p class="page__desc">Manage beneficiaries, NGOs, and donors across the platform.</p>
        </div>
        <div class="page__header-actions">
          <button class="btn btn--outline btn--sm" id="btn-export">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Export
          </button>
        </div>
      </div>

      <div class="filters-bar" data-aos>
        <div class="filter-tabs">
          <button class="filter-tab active" data-filter="all">All Users <span class="filter-tab__count">587</span></button>
          <button class="filter-tab" data-filter="beneficiary">Beneficiaries <span class="filter-tab__count">380</span></button>
          <button class="filter-tab" data-filter="ngo">NGOs <span class="filter-tab__count">42</span></button>
          <button class="filter-tab" data-filter="donor">Donors <span class="filter-tab__count">165</span></button>
        </div>
        <div class="filters-bar__right">
          <div class="filter-search">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" placeholder="Search users..." class="filter-search__input" id="user-search" />
          </div>
          <select class="filter-select" id="status-filter">
            <option value="all">All Status</option>
            <option value="active">Active</option>
            <option value="pending">Pending</option>
            <option value="inactive">Inactive</option>
          </select>
        </div>
      </div>

      <div class="table-wrapper" data-aos>
        <table class="users-table" id="users-table">
          <thead>
            <tr>
              <th><input type="checkbox" class="table-checkbox" id="select-all" /></th>
              <th>User</th>
              <th>Role</th>
              <th>Email</th>
              <th>Location</th>
              <th>Joined</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="users-tbody">
          </tbody>
        </table>
      </div>

      <div class="pagination" id="pagination">
        <div class="pagination__info">
          Showing <strong id="page-start">1</strong>–<strong id="page-end">10</strong> of <strong id="page-total">587</strong> users
        </div>
        <div class="pagination__controls">
          <button class="pagination__btn" id="prev-page" disabled>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <div class="pagination__pages" id="page-numbers">
          </div>
          <button class="pagination__btn" id="next-page">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </div>
      </div>
    </section>
  </main>

  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal__card" id="modal-card"></div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {

      const root = document.documentElement;

      document.getElementById('theme-toggle')?.addEventListener('click', () => {
        const next = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
        root.setAttribute('data-theme', next);
        try { localStorage.setItem('hs-theme', next); } catch (e) {}
      });

      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('overlay');

      document.getElementById('hamburger')?.addEventListener('click', () => {
        sidebar.classList.toggle('open');
        overlay.classList.toggle('show');
      });
      overlay?.addEventListener('click', () => {
        sidebar.classList.remove('open');
        overlay.classList.remove('show');
      });

      function esc(value) {
        return String(value).replace(/[&<>"']/g, c => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
      }

      function capitalize(str) {
        return str.charAt(0).toUpperCase() + str.slice(1);
      }

      function formatDate(dateStr) {
        return new Date(dateStr).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
      }

      function showToast(message, type = 'success') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = `toast toast--${type}`;
        const stroke = type === 'success' ? 'var(--clr-beneficiary)' : 'var(--clr-danger)';
        const icon = type === 'success'
          ? `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="${stroke}" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>`
          : `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="${stroke}" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>`;

        toast.innerHTML = `
          <span class="toast__icon">${icon}</span>
          <span class="toast__message">${esc(message)}</span>
          <span class="toast__close" role="button" aria-label="Dismiss">&#10005;</span>
        `;
        toast.querySelector('.toast__close').addEventListener('click', () => toast.remove());
        container.appendChild(toast);

        setTimeout(() => {
          toast.style.animation = 'toast-out .3s ease forwards';
          setTimeout(() => toast.remove(), 300);
        }, 4000);
      }

      const firstNames = ['Aarav','Vivaan','Aditya','Vihaan','Arjun','Reyansh','Ayaan','Krishna','Ishaan','Sai',
        'Ananya','Diya','Myra','Sara','Aanya','Aadhya','Isha','Kiara','Riya','Priya',
        'Rohan','Kabir','Shaurya','Dhruv','Yash','Arnav','Laksh','Advait','Pranav','Kartik',
        'Meera','Tara','Zara','Nisha','Kavya','Pooja','Sneha','Divya','Neha','Simran',
        'Amit','Rahul','Sanjay','Vikram','Mohit','Nikhil','Raj','Dev','Kunal','Harsh'];
      const lastNames = ['Sharma','Verma','Patel','Kumar','Singh','Gupta','Reddy','Joshi','Mehta','Shah',
        'Mishra','Chauhan','Agarwal','Rao','Nair','Pillai','Iyer','Chatterjee','Das','Bose'];
      const cities = ['Mumbai','Delhi','Bangalore','Chennai','Kolkata','Hyderabad','Pune','Ahmedabad','Jaipur','Lucknow',
        'Bhopal','Chandigarh','Kochi','Indore','Nagpur','Patna','Surat','Vadodara','Thiruvananthapuram','Coimbatore'];
      const ngoNames = ['Hope Foundation','Green Earth Trust','Child Care India','Shakti Women','AidBridge',
        'Seva Bharati','Umeed Foundation','Prayas NGO','Nirmaan Trust','Disha Foundation',
        'Akshaya Patra','Smile India','Swadesh Foundation','Udaan Trust','Sahyog NGO'];
      const roles = ['beneficiary','beneficiary','beneficiary','beneficiary','beneficiary','beneficiary','beneficiary',
        'ngo','donor','donor','donor','donor'];
      const statuses = ['active','active','active','active','active','active','active','pending','pending','inactive'];
      const avatarColors = [
        'linear-gradient(135deg,#2dd4a8,#6ee7b7)',
        'linear-gradient(135deg,#5eaaff,#93c5fd)',
        'linear-gradient(135deg,#b47aff,#c4b5fd)',
        'linear-gradient(135deg,#ff6b8a,#fda4af)',
        'linear-gradient(135deg,#f59e0b,#fcd34d)',
        'linear-gradient(135deg,#06b6d4,#67e8f9)',
      ];

      function generateUsers() {
        const users = [];
        for (let i = 0; i < 587; i++) {
          const role = roles[i % roles.length];
          const first = firstNames[i % firstNames.length];
          const last = lastNames[Math.floor(Math.random() * lastNames.length)];
          const name = role === 'ngo' ? ngoNames[i % ngoNames.length] : `${first} ${last}`;
          const city = cities[Math.floor(Math.random() * cities.length)];
          const status = statuses[Math.floor(Math.random() * statuses.length)];
          const month = String(Math.floor(Math.random() * 12) + 1).padStart(2, '0');
          const day = String(Math.floor(Math.random() * 28) + 1).padStart(2, '0');
          const year = 2024 + Math.floor(Math.random() * 3);
          users.push({
            id: `HS-${String(i + 1).padStart(4, '0')}`,
            name,
            email: `${name.toLowerCase().replace(/\s+/g, '.')}@email.com`,
            role,
            city,
            state: 'India',
            status,
            joined: `${year}-${month}-${day}`,
            avatar: name.charAt(0).toUpperCase(),
            color: avatarColors[i % avatarColors.length],
          });
        }
        return users;
      }

      const usersTable = document.getElementById('users-tbody');
      const allUsers = generateUsers();
      let filteredUsers = [...allUsers];
      let currentPage = 1;
      const perPage = 10;

      function renderTable() {
        const startIdx = (currentPage - 1) * perPage;
        const pageUsers = filteredUsers.slice(startIdx, startIdx + perPage);

        usersTable.innerHTML = pageUsers.map((u, i) => `
          <tr style="animation: fadeIn .3s ${i * 40}ms ease both">
            <td><input type="checkbox" class="table-checkbox" aria-label="Select ${esc(u.name)}" /></td>
            <td>
              <div class="user-cell">
                <div class="user-cell__avatar" style="background:${u.color}">${esc(u.avatar)}</div>
                <div>
                  <div class="user-cell__name">${esc(u.name)}</div>
                  <div class="user-cell__id">${u.id}</div>
                </div>
              </div>
            </td>
            <td><span class="role-badge role-badge--${u.role}">${capitalize(u.role)}</span></td>
            <td style="color:var(--text-secondary)">${esc(u.email)}</td>
            <td style="color:var(--text-secondary)">${esc(u.city)}</td>
            <td style="color:var(--text-muted)">${formatDate(u.joined)}</td>
            <td><span class="status-badge status-badge--${u.status}">${capitalize(u.status)}</span></td>
            <td>
              <div class="action-btns">
                <button class="action-btn" data-action="view" data-id="${u.id}" title="View" aria-label="View ${esc(u.name)}">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
                <button class="action-btn" data-action="edit" data-id="${u.id}" title="Edit" aria-label="Edit ${esc(u.name)}">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                </button>
                <button class="action-btn action-btn--danger" data-action="delete" data-id="${u.id}" title="Delete" aria-label="Delete ${esc(u.name)}">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                </button>
              </div>
            </td>
          </tr>
        `).join('');

        const total = filteredUsers.length;
        document.getElementById('page-start').textContent = total === 0 ? 0 : startIdx + 1;
        document.getElementById('page-end').textContent = Math.min(startIdx + perPage, total);
        document.getElementById('page-total').textContent = total;
        document.getElementById('select-all').checked = false;

        renderPaginationButtons();
      }

      function renderPaginationButtons() {
        const container = document.getElementById('page-numbers');
        const prevBtn = document.getElementById('prev-page');
        const nextBtn = document.getElementById('next-page');

        const totalPages = Math.max(1, Math.ceil(filteredUsers.length / perPage));
        prevBtn.disabled = currentPage <= 1;
        nextBtn.disabled = currentPage >= totalPages;

        const pages = [];
        if (totalPages <= 7) {
          for (let i = 1; i <= totalPages; i++) pages.push(i);
        } else {
          pages.push(1);
          if (currentPage > 3) pages.push('...');
          for (let i = Math.max(2, currentPage - 1); i <= Math.min(totalPages - 1, currentPage + 1); i++) pages.push(i);
          if (currentPage < totalPages - 2) pages.push('...');
          pages.push(totalPages);
        }

        container.innerHTML = pages.map(p => {
          if (p === '...') return '<span class="pagination__page" style="pointer-events:none;opacity:.4">…</span>';
          return `<button class="pagination__page ${p === currentPage ? 'active' : ''}" data-page-num="${p}">${p}</button>`;
        }).join('');

        container.querySelectorAll('[data-page-num]').forEach(btn => {
          btn.addEventListener('click', () => {
            currentPage = +btn.dataset.pageNum;
            renderTable();
          });
        });
      }

      function applyFilters() {
        const activeFilter = document.querySelector('.filter-tab.active')?.dataset.filter || 'all';
        const status = document.getElementById('status-filter').value;
        const q = document.getElementById('user-search').value.toLowerCase().trim();

        let base = activeFilter === 'all' ? [...allUsers] : allUsers.filter(u => u.role === activeFilter);
        if (status !== 'all') base = base.filter(u => u.status === status);
        if (q) {
          base = base.filter(u =>
            u.name.toLowerCase().includes(q) ||
            u.email.toLowerCase().includes(q) ||
            u.id.toLowerCase().includes(q) ||
            u.city.toLowerCase().includes(q)
          );
        }

        filteredUsers = base;
        currentPage = 1;
        renderTable();
      }

      const modal = document.getElementById('modal');
      const modalCard = document.getElementById('modal-card');
      let lastFocused = null;

      function openModal(html) {
        modalCard.innerHTML = html;
        modal.classList.add('open');
        modal.setAttribute('aria-hidden', 'false');
        modalCard.querySelectorAll('[data-close]').forEach(el => el.addEventListener('click', closeModal));
        modalCard.querySelector('input, select, button:not([data-close])')?.focus();
      }

      function closeModal() {
        modal.classList.remove('open');
        modal.setAttribute('aria-hidden', 'true');
        modalCard.innerHTML = '';
        lastFocused?.focus();
      }

      modal.addEventListener('click', e => {
        if (e.target === modal) closeModal();
      });
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && modal.classList.contains('open')) closeModal();
      });

      const closeIcon = '<button class="modal__close" data-close aria-label="Close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>';

      function viewUser(u) {
        openModal(`
          ${closeIcon}
          <div class="modal__head">
            <div class="modal__avatar" style="background:${u.color}">${esc(u.avatar)}</div>
            <div>
              <div class="modal__name">${esc(u.name)}</div>
              <div class="modal__id">${u.id}</div>
            </div>
          </div>
          <div class="modal__grid">
            <div class="modal__field">
              <span class="modal__field-label">Role</span>
              <span class="modal__field-value"><span class="role-badge role-badge--${u.role}">${capitalize(u.role)}</span></span>
            </div>
            <div class="modal__field">
              <span class="modal__field-label">Status</span>
              <span class="modal__field-value"><span class="status-badge status-badge--${u.status}">${capitalize(u.status)}</span></span>
            </div>
            <div class="modal__field modal__field--full">
              <span class="modal__field-label">Email</span>
              <span class="modal__field-value">${esc(u.email)}</span>
            </div>
            <div class="modal__field">
              <span class="modal__field-label">Location</span>
              <span class="modal__field-value">${esc(u.city)}, ${esc(u.state)}</span>
            </div>
            <div class="modal__field">
              <span class="modal__field-label">Joined</span>
              <span class="modal__field-value">${formatDate(u.joined)}</span>
            </div>
          </div>
          <div class="modal__actions">
            <button class="btn btn--ghost" data-close>Close</button>
            <button class="btn btn--primary" id="modal-edit">Edit User</button>
          </div>
        `);
        document.getElementById('modal-edit').addEventListener('click', () => editUser(u));
      }

      function editUser(u) {
        const roleOptions = ['beneficiary', 'ngo', 'donor']
          .map(r => `<option value="${r}" ${r === u.role ? 'selected' : ''}>${capitalize(r)}</option>`).join('');
        const statusOptions = ['active', 'pending', 'inactive']
          .map(s => `<option value="${s}" ${s === u.status ? 'selected' : ''}>${capitalize(s)}</option>`).join('');

        openModal(`
          ${closeIcon}
          <h3 class="modal__title">Edit ${esc(u.name)}</h3>
          <form id="modal-form" class="form-grid">
            <div class="form-group form-group--full">
              <label class="form-label" for="edit-name">Full Name</label>
              <input class="form-input" id="edit-name" value="${esc(u.name)}" required />
            </div>
            <div class="form-group form-group--full">
              <label class="form-label" for="edit-email">Email Address</label>
              <input class="form-input" id="edit-email" type="email" value="${esc(u.email)}" required />
            </div>
            <div class="form-group">
              <label class="form-label" for="edit-city">City</label>
              <input class="form-input" id="edit-city" value="${esc(u.city)}" required />
            </div>
            <div class="form-group">
              <label class="form-label" for="edit-role">Role</label>
              <select class="form-input form-select" id="edit-role">${roleOptions}</select>
            </div>
            <div class="form-group">
              <label class="form-label" for="edit-status">Status</label>
              <select class="form-input form-select" id="edit-status">${statusOptions}</select>
            </div>
            <div class="modal__actions form-group--full">
              <button type="button" class="btn btn--ghost" data-close>Cancel</button>
              <button type="submit" class="btn btn--primary">Save Changes</button>
            </div>
          </form>
        `);

        document.getElementById('modal-form').addEventListener('submit', e => {
          e.preventDefault();
          u.name = document.getElementById('edit-name').value.trim() || u.name;
          u.email = document.getElementById('edit-email').value.trim() || u.email;
          u.city = document.getElementById('edit-city').value.trim() || u.city;
          u.role = document.getElementById('edit-role').value;
          u.status = document.getElementById('edit-status').value;
          u.avatar = u.name.charAt(0).toUpperCase();
          closeModal();
          applyFilters();
          showToast(`${u.name} updated successfully!`, 'success');
        });
      }

      usersTable.addEventListener('click', e => {
        const btn = e.target.closest('.action-btn');
        if (!btn) return;
        const user = allUsers.find(u => u.id === btn.dataset.id);
        if (!user) return;
        lastFocused = btn;
        if (btn.dataset.action === 'view') viewUser(user);
        if (btn.dataset.action === 'edit') editUser(user);
        if (btn.dataset.action === 'delete') showToast('Delete is disabled in this demo.', 'error');
      });

      document.getElementById('prev-page').addEventListener('click', () => {
        if (currentPage > 1) { currentPage--; renderTable(); }
      });
      document.getElementById('next-page').addEventListener('click', () => {
        if (currentPage < Math.ceil(filteredUsers.length / perPage)) { currentPage++; renderTable(); }
      });

      document.querySelectorAll('.filter-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          applyFilters();
        });
      });

      let debounce;
      document.getElementById('user-search').addEventListener('input', () => {
        clearTimeout(debounce);
        debounce = setTimeout(applyFilters, 250);
      });

      document.getElementById('status-filter').addEventListener('change', applyFilters);

      const selectAll = document.getElementById('select-all');
      selectAll.addEventListener('change', () => {
        document.querySelectorAll('#users-tbody .table-checkbox').forEach(cb => {
          cb.checked = selectAll.checked;
        });
      });

      document.getElementById('btn-export').addEventListener('click', () => {
        showToast('User data exported successfully!', 'success');
      });

      renderTable();

      const revealEls = document.querySelectorAll('[data-aos]');
      if ('IntersectionObserver' in window) {
        const observer = new IntersectionObserver((entries, obs) => {
          entries.forEach((entry, i) => {
            if (!entry.isIntersecting) return;
            setTimeout(() => entry.target.classList.add('visible'), i * 70);
            obs.unobserve(entry.target);
          });
        }, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });
        revealEls.forEach(el => observer.observe(el));
      } else {
        revealEls.forEach(el => el.classList.add('visible'));
      }

    });
  </script>
</body>
</html>
